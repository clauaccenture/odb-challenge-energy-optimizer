# Parametros versionados del modelo y de la ingesta ESIOS.
# Las credenciales y secretos se mantienen en .env.
esios:
  locale: es
  timezone: Europe/Madrid

  ingestion:
    start: 2024-10-01
    end: 2026-09-30
    chunk_days: 30
    max_workers: 3
    retries: 4
    timeout_seconds: 90
    pause_seconds: 1
    force: false

  model:
    target_start: 2025-10-01
    target_end: 2026-09-30
    lag_days:
