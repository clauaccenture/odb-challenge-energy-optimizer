# BOCETO v0 · Caso "siderurgia" (referencia: MEGASA Siderurgica, Naron, A Coruña) · Open Data Business Challenge, caso 4.
# Misma estructura que config_desaladora.yaml. Seleccion: set ENERGY_CONFIG=config\config_siderurgia.yaml
# Simulación académica: NO representa una planta, contrato ni factura reales de MEGASA.
# Equivalencia de evidencia del PDF del equipo -> source_type:
#   PUBLICO = documented · INFERIDO = derived · ASUMIDO = hypothesis · DESCONOCIDO = null (no modelado)
version_config: 2

caso:
  nombre:
    value: "siderurgia_megasa_narón"
    source_type: documented
  sector:
    value: "siderurgia"
    source_type: documented
  cnae:
    value: "24.10"
    source_type: documented
    nota: "Fabricacion de productos basicos de hierro, acero y ferroaleaciones (PRTR 784, instalacion DEI/IPPC)"
  ubicacion:
    value: "Narón, A Coruña"
    source_type: documented
  proceso:
    value: "acería eléctrica: fundición y colado de chatarra (horno de arco) + laminación"
    source_type: documented
  etiqueta_resultado:
    value: "ahorro economico simulado antes de impuestos"
    source_type: documented
    nota: "Potencial teorico, no ahorro de MEGASA ni de factura: faltan contrato y curva real."

planta:
  consumo_diario_mwh:
    value: 100
    source_type: hypothesis
    nota: "Supuesto del ejercicio (36,5 GWh/año): se trata como una linea/agregado de cargas gestionables, NO como el consumo real de la planta. Aqui no hay volumen x consumo especifico"
  conexion_kv:
    value: 132
    source_type: derived
    nota: "L.A.T. 132 kV Mourela-Megasa documentada por la Xunta (DOG 2005 IN407A 05/458; DOG 2009 IN407A 08/278). Inferencia fuerte, no confirmada: falta la tension del punto de medida"
  dias_operacion_ano:
    value: 365
    source_type: hypothesis

carga_flexible:
  energia_diaria_mwh:
    value: 30
    source_type: hypothesis
    nota: "Parametro del reto (30 % de 100 MWh/dia), no dato de empresa"
  limite_mwh_hora:
    value: 7
    source_type: hypothesis
    nota: "7 MW de potencia flexible media en una hora; parametro del reto"
  candidatas:
    value: ["recarga de carretillas y vehiculos", "bombeo y depositos intermedios", "aire comprimido y gases con almacenamiento", "preparacion de chatarra y auxiliares", "parte de procesos programables"]
    source_type: hypothesis
    nota: "Descriptivo. No asumir flexibilidad libre del horno de arco (produccion, coladas, seguridad y calidad de red)"

