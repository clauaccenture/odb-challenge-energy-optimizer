    calendario:
      p6_antes_de_hora:
        value: 8
        source_type: documented
        nota: "Circular 3/2020 CNMC, art. 7.2 (BOE-A-2020-1066): horas locales 0-7 siempre P6"
      horas_punta:
        value: [9, 10, 11, 12, 13, 18, 19, 20, 21]
        source_type: documented
        nota: "Horas locales de punta; el resto de horas (8, 14-17, 22-23) son llano"
      periodos_por_mes:
        value:
          1: [P1, P2]
          2: [P1, P2]
          3: [P2, P3]
          4: [P4, P5]
          5: [P4, P5]
          6: [P3, P4]
          7: [P1, P2]
          8: [P3, P4]
          9: [P3, P4]
          10: [P4, P5]
          11: [P2, P3]
          12: [P1, P2]
        source_type: documented
        nota: "Temporada peninsular por mes -> [periodo en horas punta, periodo en horas llano]"
    perdidas_reguladas_fraccion:
      value: null
      source_type: hypothesis
      nota: "DESCONOCIDO para 6.3TD: las perdidas reguladas dependen del nivel de tension (el bloque 6.2TD NO sirve). Buscar los coeficientes en la Circular 3/2020 CNMC"
    anios:
      2026:
        peajes_energia_eur_mwh:
          value: {P1: 11.279, P2: 5.324, P3: 1.994, P4: 0.995, P5: 0.048, P6: 0.014}
          source_type: documented
          nota: "EUR/MWh (el BOE publica EUR/kWh). Resolucion CNMC 18/12/2025, anexo I apartado 1.b, fila 6.3 TD (BOE-A-2025-26348)"
        cargos_energia_eur_mwh:
          value: {P1: 7.496, P2: 5.552, P3: 2.998, P4: 1.499, P5: 0.961, P6: 0.600}
          source_type: hypothesis
          nota: "EUR/MWh. Orden TED/1524/2025 (BOE-A-2025-26705), fila del segmento 5. Hipotesis hasta confirmar que segmento 5 = 6.3TD"
        festivos_nacionales:
          value: [2026-01-01, 2026-01-06, 2026-05-01, 2026-08-15, 2026-10-12, 2026-11-01, 2026-12-06, 2026-12-08, 2026-12-25]
          source_type: documented
          nota: "Fecha fija y no sustituibles, mas el 6 de enero. Sabados, domingos y festivos: todo el dia P6"

# Los importes estimados NO son una oferta de Som Energia ni estimaciones calibradas.
# Todos los componentes monetarios se expresan en EUR/MWh, antes de impuestos.
contrato:
  modelo:
    value: "som_energia_referencia_v1"
    source_type: hypothesis
    nota: "Formula publica; contrato ficticio, sin oferta individualizada 6.2TD."
  resolucion:
    value: "horaria_media_cuartohoraria"
    source_type: hypothesis
    nota: "Precio REData = media de cuatro cuartos; potencia constante dentro de cada hora."
  liquidacion_negativos:
    value: "sin_suelo_simulado"
    source_type: hypothesis
    nota: "Se conserva PH aunque sea negativo; NO confirma liquidacion contractual Som Energia."
  factor_formula:
    value: 1.015
    source_type: documented
    nota: "Factor de la formula publica; no es IVA ni IEE."
  pc_eur_mwh:
    value: {P1: 0.465, P2: 0.213, P3: 0.142, P4: 0.107, P5: 0.107, P6: 0.0}
    source_type: derived
    nota: "BOE-A-2025-26705, apartado tercero, segmento 4; EUR/MWh (publicado en EUR/kWh). P6 aparece sin importe: 0 provisional por interpretacion de celda en blanco, confirmar criterio de aplicacion."
  sc_eur_mwh:
    value: 10.0
    source_type: hypothesis
    nota: "Aproximacion constante de costes de red; no reproduce servicios de ajuste reales."
  dsv_eur_mwh:
    value: 2.0
    source_type: hypothesis
    nota: "PROVISIONAL de la demo; para calculo real sustituir por 0.14 * (0.5*(CoDsvSu+CoDsvBa)+BS3+RAD3), con series REE. NO equivale al 14 % del spot."
  factor_desvio_som_por_trimestre:
    value: {t1: 0.14, t2: 0.14, t3: 0.14, t4: 0.14}
    source_type: documented
    nota: "Som Energia, historico tarifa indexada 2026; solo metadato hasta integrar las series REE."
  posom_eur_mwh:
    value: 0.24402
    source_type: derived
    nota: "Referencia regulatoria 2026: 0.20332 REE (BOE-A-2025-27211) + 0.04070 OMIE (BOE-A-2025-26705). Aplicacion por MWh de programa: aproximada sobre consumo medido, sin cuota fija."
  coste_omie_2026_eur_mwh:
    value: 0.04070
    source_type: documented
    nota: "BOE-A-2025-26705, apartado octavo, importe comercializadores/consumidores directos por MWh del programa final."
  coste_ree_os_2026_eur_mwh:
    value: 0.20332
    source_type: documented
    nota: "BOE-A-2025-27211, cuota variable OS 2026: fuente auxiliar; no sustituye POsOm conjunto."
  perdidas_fraccion:
    value: 0.04
    source_type: hypothesis
    nota: "PROVISIONAL: coeficientes 6.2TD P1-P6 disponibles arriba; falta factor corrector horario de REE. No usar tabla base sin validar metodo."
  fe_eur_mwh:
    value: 2.0
    source_type: hypothesis
    nota: "PROVISIONAL: orden TED/133/2026 fija RFE=2.4374639 EUR/MWh para PVPC, NO prueba valor FE especifico de Som Energia."
  f_eur_mwh:
    value: 16.0
    source_type: hypothesis
    nota: "Referencia publica 6.1TD 0.016 EUR/kWh, tambien publicada 3.0TD; aplicacion contractual 6.2TD no confirmada. No es valor garantizado para la desaladora."
  gdo_eur_mwh_por_trimestre:
    t1:
      value: 0.650
      source_type: documented
    t2:
      value: 0.965
      source_type: documented
    t3:
      value: 1.405
      source_type: documented
    t4:
      value: 1.690
      source_type: hypothesis
      nota: "Valor 1.690 recogido de la revision interna, pero no confirmado en la version publica del historico consultada hoy; verificar antes de presentar como documentado."
  criterio_gdo:
    value: "historico_sin_impuestos"
    source_type: hypothesis
    nota: "Se adopta la tabla titulada sin impuestos; hay ambiguedad fiscal en otras paginas."

