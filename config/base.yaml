# =====================================================================================================
# base.yaml · PARAMETROS COMUNES a todas las industrias del Energy Optimizer
# =====================================================================================================
# Uso: config_loader lee este archivo y le superpone config/industrias/<caso>.yaml. Lo que define la
# industria sustituye a lo de aqui; lo que no define, se hereda. Para cambiar de cliente solo se cambia
# el archivo de industria (ENERGY_CONFIG=config\industrias\<caso>.yaml); la base no se toca.
#
# Cada parametro lleva: value, source_type y nota.
#   source_type:  documented (dato publico) · derived (inferido) · hypothesis (asumido)
#   value: null = DESCONOCIDO / no modelado
# Simulacion academica: NO representa una planta, contrato ni factura reales.
#
# DEBE definirlo cada archivo de industria (no esta en la base):
#   caso:        nombre, sector, cnae, ubicacion, proceso, etiqueta_resultado
#   planta:      consumo_diario_mwh  (directo)  O  volumen_m3_dia + consumo_especifico_kwh_m3  (derivado),
#                conexion_kv, dias_operacion_ano
#   tarifa:      acceso (6.2TD, 6.3TD...), zona, anio_regulatorio, segmento_cargos
# PUEDE sobrescribir (opcional): carga_flexible, baseline_s0, optimizacion_s1 (restricciones de proceso),
#   contrato (si se conoce el real), operacion_demo.potencia_contratada_mw, bloque "desconocido".
# =====================================================================================================
version_config: 2

# --- Valores por defecto del reto (la industria los sobrescribe si se aparta) ---------------------------
carga_flexible:
  energia_diaria_mwh:
    value: 30
    source_type: hypothesis
    nota: "Parametro del reto: energia que puede desplazarse dentro del mismo dia (MWh/dia)"
  limite_mwh_hora:
    value: 7
    source_type: hypothesis
    nota: "7 MW de potencia flexible media en una hora; la viabilidad depende de la potencia contratada (desconocida)"

baseline_s0:
  mwh_hora:
    value: 2.5
    source_type: hypothesis
    nota: "Baseline operacional sintetico comun del reto: 12 h x 2,5 MWh = 30 MWh/dia"
  hora_inicio:
    value: 8
    source_type: hypothesis
  hora_fin:
    value: 20
    source_type: hypothesis
    nota: "Hasta las 20:00 sin incluir la hora que empieza a las 20:00"

optimizacion_s1:
  franja_preferente_inicio:
    value: 8
    source_type: hypothesis
    nota: "Regla de desempate del equipo"
  franja_preferente_fin:
    value: 17
    source_type: hypothesis
  # Restricciones operativas: null = no se modela. Si alguna deja de ser null,
  # el llenado de barato a caro ya no es optimo y hay que usar programacion lineal.
  rampa_max_mwh_hora:
    value: null
    source_type: hypothesis
  min_horas_encendido:
    value: null
    source_type: hypothesis
  coste_arranque_eur:
    value: null
    source_type: hypothesis

# --- Mercado -----------------------------------------------------------------------------------------

mercado:
  fuente:
    value: "REData"
    source_type: documented
  serie:
    value: "Precio mercado spot"
    source_type: documented
  zona_horaria:
    value: "Europe/Madrid"
    source_type: documented
  politica_negativos:
    value: "sin_truncar"
    source_type: documented
    nota: "Mismo termino que 03_gold. El spot negativo permanece negativo (no clip, no max(precio,0))"
  fecha_inicio:
    value: null
    source_type: hypothesis
    nota: "null = primera fecha Silver disponible dentro de la vigencia de la tarifa."
  fecha_fin:
    value: null
    source_type: hypothesis
    nota: "null = ultima fecha Silver disponible con tarifa; sin corte en septiembre u octubre."

# tarifa.acceso y tarifa.anio_regulatorio ELIGEN que datos regulados se usan: se leen del bloque
# tarifas_reguladas (mas abajo). Para otro año u otra tarifa basta con añadir su bloque de datos.

# Componentes del precio indexado de la demo; peajes y cargos se incluyen una sola vez.
componentes:
  spot:
    value: true
    source_type: documented
  peaje_energia:
    value: true
    source_type: documented
  cargo_energia:
    value: true
    source_type: documented
  perdidas:
    value: true
    source_type: hypothesis
    nota: "Coeficiente constante de demo, no serie regulada de REE."
  iee:
    value: false
    source_type: hypothesis
  iva:
    value: false
    source_type: hypothesis
  potencia_y_excesos:
    value: false
    source_type: hypothesis
    nota: "Fuera de alcance"

# Datos regulados por tarifa y año. Fuente unica: src/tarifas_6_2td.py solo los lee de aqui.

# --- Datos regulados por tarifa y año. Fuente unica: src/tarifas_6_2td.py solo los lee de aqui. ------------
# Para otra tarifa u otro año basta con añadir su bloque. Peajes: Resolucion CNMC 18/12/2025 (BOE-A-2025-26348).
# Cargos: Orden TED/1524/2025 (BOE-A-2025-26705). El calendario P1-P6 es el mismo para toda la familia 6.xTD.
tarifas_reguladas:
  6.2TD:
    calendario:
      p6_antes_de_hora:
        value: 8
        source_type: documented
        nota: "Circular 3/2020 CNMC, art. 7.2 (BOE-A-2020-1066): horas locales 0-7 siempre P6"
      horas_punta:
        value: [9, 10, 11, 12, 13, 18, 19, 20, 21]
        source_type: documented
        nota: "Horas locales de punta; el resto de horas (8, 14-17, 22-23) son llano"
      periodos_por_mes:
        value:
          1: [P1, P2]
          2: [P1, P2]
          3: [P2, P3]
          4: [P4, P5]
          5: [P4, P5]
          6: [P3, P4]
          7: [P1, P2]
          8: [P3, P4]
          9: [P3, P4]
          10: [P4, P5]
          11: [P2, P3]
          12: [P1, P2]
        source_type: documented
        nota: "Temporada peninsular por mes -> [periodo en horas punta, periodo en horas llano]"
    perdidas_reguladas_fraccion:
      value: {P1: 0.052, P2: 0.054, P3: 0.049, P4: 0.050, P5: 0.035, P6: 0.054}
      source_type: documented
      nota: "Circular 3/2020 CNMC, art. 11 (segun el documento regulatorio del equipo). Som aplica ademas un factor corrector horario de REE: aqui es solo una aproximacion"
    anios:
      # 2025: pendiente (peajes: Resolucion CNMC 4/12/2024; cargos 2025). Sin este bloque no se
      # calculan peajes ni cargos para fechas de 2025 (no se mezclan años).
      2026:
        peajes_energia_eur_mwh:
          value: {P1: 14.736, P2: 7.202, P3: 2.542, P4: 1.254, P5: 0.062, P6: 0.020}
          source_type: documented
          nota: "EUR/MWh (el BOE publica EUR/kWh). Resolucion CNMC 18/12/2025, anexo I (BOE-A-2025-26348)"
        cargos_energia_eur_mwh:
          value: {P1: 9.144, P2: 6.773, P3: 3.658, P4: 1.829, P5: 1.172, P6: 0.732}
          source_type: documented
          nota: "EUR/MWh. Orden TED/1524/2025, segmento 4 = 6.2TD (BOE-A-2025-26705)"
        festivos_nacionales:
          value: [2026-01-01, 2026-01-06, 2026-05-01, 2026-08-15, 2026-10-12, 2026-11-01, 2026-12-06, 2026-12-08, 2026-12-25]
          source_type: documented
          nota: "Fecha fija y no sustituibles, mas el 6 de enero. Sin Viernes Santo (no tiene fecha fija). Sabados, domingos y festivos: todo el dia P6"

  6.3TD:
    calendario:
      p6_antes_de_hora:
        value: 8
        source_type: documented
        nota: "Circular 3/2020 CNMC, art. 7.2 (BOE-A-2020-1066): horas locales 0-7 siempre P6"
      horas_punta:
        value: [9, 10, 11, 12, 13, 18, 19, 20, 21]
        source_type: documented
        nota: "Horas locales de punta; el resto de horas (8, 14-17, 22-23) son llano"
      periodos_por_mes:
        value:
          1: [P1, P2]
          2: [P1, P2]
          3: [P2, P3]
          4: [P4, P5]
          5: [P4, P5]
          6: [P3, P4]
          7: [P1, P2]
          8: [P3, P4]
          9: [P3, P4]
          10: [P4, P5]
          11: [P2, P3]
          12: [P1, P2]
        source_type: documented
        nota: "Temporada peninsular por mes -> [periodo en horas punta, periodo en horas llano]"
    perdidas_reguladas_fraccion:
      value: null
      source_type: hypothesis
      nota: "DESCONOCIDO para 6.3TD: las perdidas reguladas dependen del nivel de tension (el bloque 6.2TD NO sirve). Buscar los coeficientes en la Circular 3/2020 CNMC"
    anios:
      2026:
        peajes_energia_eur_mwh:
          value: {P1: 11.279, P2: 5.324, P3: 1.994, P4: 0.995, P5: 0.048, P6: 0.014}
