      horas_punta:
        value: [9, 10, 11, 12, 13, 18, 19, 20, 21]
        source_type: documented
        nota: "Horas locales de punta; el resto de horas (8, 14-17, 22-23) son llano"
      periodos_por_mes:
        value:
          1: [P1, P2]
          2: [P1, P2]
          3: [P2, P3]
          4: [P4, P5]
          5: [P4, P5]
          6: [P3, P4]
          7: [P1, P2]
          8: [P3, P4]
          9: [P3, P4]
          10: [P4, P5]
          11: [P2, P3]
          12: [P1, P2]
        source_type: documented
        nota: "Temporada peninsular por mes -> [periodo en horas punta, periodo en horas llano]"
    perdidas_reguladas_fraccion:
      value: {P1: 0.052, P2: 0.054, P3: 0.049, P4: 0.050, P5: 0.035, P6: 0.054}
      source_type: documented
      nota: "Circular 3/2020 CNMC, art. 11 (segun el documento regulatorio del equipo). Som aplica ademas un factor corrector horario de REE: aqui es solo una aproximacion"
    anios:
