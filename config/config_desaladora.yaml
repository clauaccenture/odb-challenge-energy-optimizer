# Configuración del caso "desaladora" (referencia: TFM Univ. de Sevilla, 50.000 m3/dia, 66 kV).
# Cada parámetro lleva: value, source_type (documented | derived | hypothesis) y nota.
# Simulación académica: NO representa una planta, contrato ni factura reales.
version_config: 1

caso:
  nombre:
    value: "desaladora_tfm_sevilla"
    source_type: documented
  etiqueta_resultado:
    value: "ahorro economico simulado antes de impuestos"
    source_type: documented
    nota: "Nunca llamarlo ahorro de factura."

planta:
  volumen_m3_dia:
    value: 50000
    source_type: documented
    nota: "Ficha publica del TFM"
  consumo_especifico_kwh_m3:
    value: 3
    source_type: hypothesis
    nota: "Referencia sectorial, no medicion de la planta"
  conexion_kv:
    value: 66
    source_type: documented
  dias_operacion_ano:
    value: 365
    source_type: hypothesis
    nota: "Plena produccion todo el año"

carga_flexible:
  energia_diaria_mwh:
    value: 30
    source_type: hypothesis
    nota: "Definicion del caso (20 % del consumo estimado)"
  limite_mwh_hora:
    value: 7
    source_type: hypothesis
    nota: "Equivale a 7 MW medios; viabilidad depende de potencia contratada (no disponible)"

baseline_s0:
  mwh_hora:
    value: 2.5
    source_type: hypothesis
  hora_inicio:
    value: 8
    source_type: hypothesis
  hora_fin:
    value: 20
    source_type: hypothesis
    nota: "Hasta las 20:00 sin incluir la hora que empieza a las 20:00"

optimizacion_s1:
  franja_preferente_inicio:
    value: 8
    source_type: hypothesis
    nota: "Regla de desempate del equipo"
  franja_preferente_fin:
    value: 17
    source_type: hypothesis
  # Restricciones operativas: null = no se modela. Si alguna deja de ser null,
  # el llenado de barato a caro ya no es optimo y hay que usar programacion lineal.
  rampa_max_mwh_hora:
    value: null
    source_type: hypothesis
  min_horas_encendido:
    value: null
    source_type: hypothesis
  coste_arranque_eur:
    value: null
    source_type: hypothesis
  deposito_agua_mwh_equivalente:
    value: null
    source_type: hypothesis

mercado:
  fuente:
    value: "REData"
    source_type: documented
  serie:
    value: "Precio mercado spot"
    source_type: documented
  zona_horaria:
    value: "Europe/Madrid"
    source_type: documented
  politica_negativos:
    value: "sin_truncar"
    source_type: documented
    nota: "Mismo termino que 03_gold. El spot negativo permanece negativo (no clip, no max(precio,0))"
  fecha_inicio:
    value: "2025-10-01"
    source_type: documented
  fecha_fin:
    value: "2026-09-30"
    source_type: documented

# tarifa.acceso y tarifa.anio_regulatorio ELIGEN que datos regulados se usan: se leen del bloque
# tarifas_reguladas (mas abajo). Para otro año u otra tarifa basta con añadir su bloque de datos.
tarifa:
  acceso:
    value: "6.2TD"
    source_type: hypothesis
    nota: "66 kV encaja en 30-72,5 kV, pero no hay contrato que lo confirme"
  zona:
    value: "peninsula"
    source_type: hypothesis
  anio_regulatorio:
    value: 2026
    source_type: documented
  segmento_cargos:
    value: 4
    source_type: documented
    nota: "Para 6.2TD es el segmento 4, no el 5"

componentes:
  spot:
    value: true
    source_type: documented
  peaje_energia:
    value: true
    source_type: documented
  cargo_energia:
    value: true
    source_type: documented
  perdidas:
    value: false
    source_type: hypothesis
    nota: "Desactivado: depende del contrato (no existe)"
  margen_comercial_eur_mwh:
    value: 0
    source_type: hypothesis
    nota: "No modelado por falta de contrato (aqui encaja la formula de la comercializadora)"
  desvios_eur_mwh:
    value: 0
    source_type: hypothesis
    nota: "No modelado por falta de contrato"
  otros_costes_eur_mwh:
    value: 0
    source_type: hypothesis
    nota: "No modelado por falta de contrato"
  iee:
    value: false
    source_type: hypothesis
  iva:
    value: false
    source_type: hypothesis
  potencia_y_excesos:
    value: false
    source_type: hypothesis
    nota: "Fuera de alcance"

# Datos regulados por tarifa y año. Fuente unica: src/tarifas_6_2td.py solo los lee de aqui.
tarifas_reguladas:
  6.2TD:
    calendario:
      p6_antes_de_hora:
        value: 8
        source_type: documented
        nota: "Circular 3/2020 CNMC, art. 7.2 (BOE-A-2020-1066): horas locales 0-7 siempre P6"
      horas_punta:
        value: [9, 10, 11, 12, 13, 18, 19, 20, 21]
        source_type: documented
        nota: "Horas locales de punta; el resto de horas (8, 14-17, 22-23) son llano"
      periodos_por_mes:
        value:
          1: [P1, P2]
          2: [P1, P2]
          3: [P2, P3]
          4: [P4, P5]
          5: [P4, P5]
          6: [P3, P4]
          7: [P1, P2]
          8: [P3, P4]
          9: [P3, P4]
          10: [P4, P5]
          11: [P2, P3]
          12: [P1, P2]
        source_type: documented
        nota: "Temporada peninsular por mes -> [periodo en horas punta, periodo en horas llano]"
    anios:
      # 2025: pendiente (peajes: Resolucion CNMC 4/12/2024; cargos 2025). Sin este bloque no se
      # calculan peajes ni cargos para fechas de 2025 (no se mezclan años).
      2026:
        peajes_energia_eur_mwh:
          value: {P1: 14.736, P2: 7.202, P3: 2.542, P4: 1.254, P5: 0.062, P6: 0.020}
          source_type: documented
          nota: "EUR/MWh (el BOE publica EUR/kWh). Resolucion CNMC 18/12/2025, anexo I (BOE-A-2025-26348)"
        cargos_energia_eur_mwh:
          value: {P1: 9.144, P2: 6.773, P3: 3.658, P4: 1.829, P5: 1.172, P6: 0.732}
          source_type: documented
          nota: "EUR/MWh. Orden TED/1524/2025, segmento 4 = 6.2TD (BOE-A-2025-26705)"
        festivos_nacionales:
          value: [2026-01-01, 2026-01-06, 2026-05-01, 2026-08-15, 2026-10-12, 2026-11-01, 2026-12-06, 2026-12-08, 2026-12-25]
          source_type: documented
          nota: "Fecha fija y no sustituibles, mas el 6 de enero. Sin Viernes Santo (no tiene fecha fija). Sabados, domingos y festivos: todo el dia P6"