# Modelo de precio de la energia (contrato de referencia: tarifa indexada 6.2TD de Som Energia).
# PH = factor_global * [(PHM + Pc + Sc + Dsv + GdO + POsOm) * (1 + Perd) + FE + F] + PTD + CA
# PHM = spot de REData (comprobar que es el precio OMIE); PTD y CA salen de tarifas_reguladas.
# Todos los terminos tienen ahora un valor ESTIMADO (hypothesis) con su nota y, si procede, un rango.
# null seguiria significando NO modelado (vale 0).
contrato:
  modelo_precio:
    value: "som_indexada_6_2td"      # alternativa: "spot_mas_regulado" (lo de hoy)
    source_type: hypothesis
    nota: "Tarifa publicada, no contrato firmado con la desaladora"
  fase_modelo:
    value: 3                         # 1 = PHM+PTD+CA · 2 = +perdidas y adquisicion · 3 = completa
    source_type: hypothesis
  fases:
    value:
      2: [perdidas, pagos_capacidad_eur_mwh, sobrecostes_eur_mwh, posom_eur_mwh, fondo_eficiencia_eur_mwh]
      3: [desvios_eur_mwh, factor_desvio, garantias_origen_eur_mwh, margen_f_eur_mwh]
    source_type: hypothesis
    nota: "Terminos que deben tener valor para usar cada fase (la 1 no necesita ninguno). Reparto propuesto, a validar con el equipo"
  formula:
    factor_global:
      value: 1.015
      source_type: documented
      nota: "Aparece en la formula publicada de Som Energia; ninguna fuente lo explica"
    # --- Valores de los terminos (todos en EUR/MWh salvo factores). Estimaciones: ver nota y rango de cada uno ---
    pagos_capacidad_eur_mwh:
      value: {P1: 0.465, P2: 0.213, P3: 0.142, P4: 0.107, P5: 0.107, P6: 0.107}
      source_type: hypothesis
      nota: "Pc. Orden TED/1524/2025 (BOE-A-2025-26705), apartado Tercero, segmento 4, EUR/kWh x 1000. La lectura automatica del BOE dio solo 5 cifras (P1-P5): P6 = P5 es SUPUESTO, verificar en el BOE"
    sobrecostes_eur_mwh:
      value: 15.78
      rango: [12.6, 18.9]
      source_type: hypothesis
      nota: "Sc. Servicios de ajuste, media 2025 (PDF Precio_electricidad_industrial_v3_2, calculo propio de un companero). Falta la serie exacta de REE/ESIOS. Es un promedio constante, no horario"
    desvios_eur_mwh:
      value: 0
      source_type: hypothesis
      nota: "Dsv. Sin dato separado: se considera incluido en Sc (agregado de REE). Cambiar si se obtiene su serie"
    factor_desvio:
      value: 1.0
      source_type: hypothesis
      nota: "Factor propio de Som Energia, no publicado. Neutro (1.0) hasta que la consultora lo confirme"
    garantias_origen_eur_mwh:
      value: 1.0
      rango: [0.5, 2.0]
      source_type: hypothesis
      nota: "GdO. Orden de magnitud del precio de mercado de las garantias de origen, SIN fuente verificada. Pendiente de validar por la consultora"
    posom_eur_mwh:
      value: 0.24
      rango: [0.2, 0.3]
      source_type: hypothesis
      nota: "POsOm. Operadores OMIE + REE, segun el PDF del companero. Contrastar con la CNMC"
    fondo_eficiencia_eur_mwh:
      value: 2.44
      source_type: hypothesis
      nota: "FE. FNEE 0,0024374639 EUR/kWh (Orden TED/133/2026) x 1000. Verificar en el BOE; el PDF del companero no lo incluye en su simulacion"
    margen_f_eur_mwh:
      value: 10
      rango: [3, 20]
      escenarios: {bajo: 3, central: 10, alto: 17}
      source_type: hypothesis
      nota: "F. Margen comercial, NO publicado. Rango del PDF (3-20); 17 = Candela 6.1TD. Pendiente de validar por la consultora. Es un sumando casi igual en todas las horas: cambia el coste absoluto, apenas el ahorro"
  liquidacion_precio_negativo:
    value: "sin_suelo"               # o "suelo_cero"
    source_type: hypothesis
    nota: "No se ha encontrado como liquida Som Energia los importes horarios negativos en 6.2TD; calcular ambos como sensibilidad"

