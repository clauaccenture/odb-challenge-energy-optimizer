          source_type: documented
          nota: "EUR/MWh (el BOE publica EUR/kWh). Resolucion CNMC 18/12/2025, anexo I (BOE-A-2025-26348)"
        cargos_energia_eur_mwh:
          value: {P1: 9.144, P2: 6.773, P3: 3.658, P4: 1.829, P5: 1.172, P6: 0.732}
          source_type: documented
          nota: "EUR/MWh. Orden TED/1524/2025, segmento 4 = 6.2TD (BOE-A-2025-26705)"
        festivos_nacionales:
          value: [2026-01-01, 2026-01-06, 2026-05-01, 2026-08-15, 2026-10-12, 2026-11-01, 2026-12-06, 2026-12-08, 2026-12-25]
          source_type: documented
