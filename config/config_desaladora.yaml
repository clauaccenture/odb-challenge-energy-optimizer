# Configuración del caso "desaladora" (referencia: TFM Univ. de Sevilla, 50.000 m3/dia, 66 kV).
# Cada parámetro lleva: value, source_type (documented | derived | hypothesis) y nota.
# Simulación académica: NO representa una planta, contrato ni factura reales.
version_config: 2
 
caso:
  nombre:
    value: "desaladora_tfm_sevilla"
    source_type: documented
  etiqueta_resultado:
    value: "ahorro economico simulado antes de impuestos"
    source_type: documented
    nota: "Nunca llamarlo ahorro de factura."
 
planta:
  volumen_m3_dia:
    value: 50000
    source_type: documented
    nota: "Ficha publica del TFM"
  consumo_especifico_kwh_m3:
    value: 3
    source_type: hypothesis
    nota: "Referencia sectorial, no medicion de la planta"
  conexion_kv:
    value: 66
    source_type: documented
  dias_operacion_ano:
    value: 365
    source_type: hypothesis
    nota: "Plena produccion todo el año"
 
carga_flexible:
  energia_diaria_mwh:
    value: 30
    source_type: hypothesis
    nota: "Definicion del caso (20 % del consumo estimado)"
  limite_mwh_hora:
    value: 7
    source_type: hypothesis
    nota: "Equivale a 7 MW medios; viabilidad depende de potencia contratada (no disponible)"
 
baseline_s0:
  mwh_hora:
    value: 2.5
    source_type: hypothesis
  hora_inicio:
    value: 8
    source_type: hypothesis
  hora_fin:
    value: 20
    source_type: hypothesis
    nota: "Hasta las 20:00 sin incluir la hora que empieza a las 20:00"
 
optimizacion_s1:
  franja_preferente_inicio:
    value: 8
    source_type: hypothesis
    nota: "Regla de desempate del equipo"
  franja_preferente_fin:
    value: 17
    source_type: hypothesis
  # Restricciones operativas: null = no se modela. Si alguna deja de ser null,
  # el llenado de barato a caro ya no es optimo y hay que usar programacion lineal.
  rampa_max_mwh_hora:
    value: null
    source_type: hypothesis
  min_horas_encendido:
    value: null
    source_type: hypothesis
  coste_arranque_eur:
    value: null
    source_type: hypothesis
  deposito_agua_mwh_equivalente:
    value: null
    source_type: hypothesis
 
mercado:
  fuente:
    value: "REData"
    source_type: documented
  serie:
    value: "Precio mercado spot"
    source_type: documented
  zona_horaria:
    value: "Europe/Madrid"
    source_type: documented
  politica_negativos:
    value: "sin_truncar"
    source_type: documented
    nota: "Mismo termino que 03_gold. El spot negativo permanece negativo (no clip, no max(precio,0))"
  fecha_inicio:
    value: null
    source_type: hypothesis
    nota: "null = primera fecha Silver disponible dentro de la vigencia de la tarifa."
  fecha_fin:
    value: null
    source_type: hypothesis
    nota: "null = ultima fecha Silver disponible con tarifa; sin corte en septiembre u octubre."
 
# Los importes de peajes y cargos y el calendario P1-P6 NO estan aqui: viven en src/tarifas_6_2td.py
# (fuente unica). Este bloque solo identifica la tarifa y debe coincidir con ese modulo.
tarifa:
  acceso:
    value: "6.2TD"
    source_type: hypothesis
    nota: "66 kV encaja en 30-72,5 kV, pero no hay contrato que lo confirme"
  zona:
    value: "peninsula"
    source_type: hypothesis
  anio_regulatorio:
    value: 2026
    source_type: documented
  segmento_cargos:
    value: 4
    source_type: documented
    nota: "Para 6.2TD es el segmento 4, no el 5"
 
componentes:
  spot:
    value: true
    source_type: documented
  peaje_energia:
    value: true
    source_type: documented
  cargo_energia:
    value: true
    source_type: documented
  perdidas:
    value: true
    source_type: hypothesis
    nota: "Coeficiente constante de demo, no serie regulada de REE."
  iee:
    value: false
    source_type: hypothesis
  iva:
    value: false
    source_type: hypothesis
  potencia_y_excesos:
    value: false
    source_type: hypothesis
    nota: "Fuera de alcance"

# Los importes estimados NO son una oferta de Som Energia ni estimaciones calibradas.
# Todos los componentes monetarios se expresan en EUR/MWh, antes de impuestos.
contrato:
  modelo:
    value: "som_energia_referencia_v1"
    source_type: hypothesis
    nota: "Formula publica; contrato ficticio, sin oferta individualizada 6.2TD."
  resolucion:
    value: "horaria_media_cuartohoraria"
    source_type: hypothesis
    nota: "Precio REData = media de cuatro cuartos; potencia constante dentro de cada hora."
  liquidacion_negativos:
    value: "sin_suelo_simulado"
    source_type: hypothesis
    nota: "Se conserva PH aunque sea negativo; NO confirma liquidacion contractual Som Energia."
  factor_formula:
    value: 1.015
    source_type: documented
    nota: "Factor de la formula publica; no es IVA ni IEE."
  pc_eur_mwh:
    value: 0.5
    source_type: hypothesis
    nota: "Constante ilustrativa, no valor regulado verificado."
  sc_eur_mwh:
    value: 10.0
    source_type: hypothesis
    nota: "Aproximacion constante de costes de red; no reproduce servicios de ajuste reales."
  dsv_eur_mwh:
    value: 2.0
    source_type: hypothesis
    nota: "Coste absoluto supuesto. NO es el 14 % publicado ni se aplica como porcentaje del spot."
  posom_eur_mwh:
    value: 0.2
    source_type: hypothesis
    nota: "Constante ilustrativa conjunta de operadores; no liquidacion oficial."
  perdidas_fraccion:
    value: 0.04
    source_type: hypothesis
    nota: "4 % ilustrativo; sustituir por coeficientes REE de 6.2TD para una replica contractual."
  fe_eur_mwh:
    value: 2.0
    source_type: hypothesis
    nota: "Aportacion ilustrativa; no obligacion individual confirmada de la comercializadora."
  f_eur_mwh:
    value: 16.0
    source_type: hypothesis
    nota: "Referencia publica 6.1TD de 0,016 EUR/kWh; extrapolada a 6.2TD, no oferta confirmada."
  gdo_eur_mwh_por_trimestre:
    t1:
      value: 0.650
      source_type: documented
    t2:
      value: 0.965
      source_type: documented
    t3:
      value: 1.405
      source_type: documented
    t4:
      value: 1.690
      source_type: documented
  criterio_gdo:
    value: "historico_sin_impuestos"
    source_type: hypothesis
    nota: "Se adopta la tabla titulada sin impuestos; hay ambiguedad fiscal en otras paginas."

operacion_demo:
  perfil_no_flexible:
    value: "uniforme_energia_diaria"
    source_type: hypothesis
    nota: "Consumo total estimado menos 30 MWh flexibles, repartido entre las 23/24/25 horas reales."
  potencia_contratada_mw:
    p1: {value: 12.5, source_type: hypothesis}
    p2: {value: 12.5, source_type: hypothesis}
    p3: {value: 12.5, source_type: hypothesis}
    p4: {value: 12.5, source_type: hypothesis}
    p5: {value: 12.5, source_type: hypothesis}
    p6: {value: 12.5, source_type: hypothesis}
  flexibilidad_validada_en_planta:
    value: false
    source_type: hypothesis
    nota: "Carga agregada idealizada; no demuestra viabilidad de bombas, membranas ni deposito."

fuentes_demo:
  fecha_consulta: "2026-11-12"
  formula: "https://www.somenergia.coop/es/servicios/como-calculamos-el-precio"
  historico_gdo: "https://www.somenergia.coop/es/historico-tarifa-indexada"
  referencia_f_6_1td: "https://www.somenergia.coop/es/tarifas-luz/altatension-indexada"
  condiciones_6_2td: "https://es.support.somenergia.coop/article/1343-tarifas-de-alta-tension-6-1td-6-2td-6-3td-y-6-4td-indexadas"
  peajes: "https://www.boe.es/buscar/doc.php?id=BOE-A-2025-26348"
  cargos: "https://www.boe.es/buscar/doc.php?id=BOE-A-2025-26705"
 